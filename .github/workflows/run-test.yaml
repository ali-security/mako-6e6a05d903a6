name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector passed through tox posargs"
        required: false
        default: ""

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 40
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

        include:
          # CPython 3.7 has no arm64 macOS build and cannot be built from
          # source on arm64 macos-latest (openssl@1.1 is gone from Homebrew);
          # run this one leg on the Intel macOS runner, where the prebuilt
          # x64 interpreter from actions/python-versions works natively
          - os: "macos-latest"
            python-version: "3.7"
            runner: "macos-15-intel"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          pip list

      - name: Run tests
        run: tox -- ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        env:
          PIP_INDEX_URL: "https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/"
        run: |
          pip install build
          python -m build

      - name: Upload dist
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
